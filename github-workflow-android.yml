# NIITE — Android APK build
#
# KUTUMIA: hamisha faili hili kwenda .github/workflows/android.yml
# (GitHub inahitaji workflow ziwe ndani ya .github/workflows/),
# kisha commit. Kila push itajenga APK, na unaipakua kutoka
# tab "Actions" -> run ya mwisho -> Artifacts -> niite-apk

name: Build NIITE APK

on:
  push:
    branches:
      - main
      - chatgiza-updates
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp styles.css www/styles.css
          cp app.js www/app.js
          cp config.js www/config.js
          cp manifest.json www/manifest.json
          echo "--- www contents ---"
          ls -la www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: niite-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
