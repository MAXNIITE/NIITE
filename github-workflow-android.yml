# NIITE — Android APK build
#
# KUTUMIA: hamisha faili hili kwenda .github/workflows/android.yml
# (GitHub inahitaji workflow ziwe ndani ya .github/workflows/),
# kisha commit. Kila push itajenga APK kwenye GitHub yenyewe.
#
# APK inapatikana kwa njia MBILI:
#   1. Releases -> "APK ya mwisho"  (link ya moja kwa moja ya kupakua)
#   2. Actions -> run ya mwisho -> Artifacts -> niite-apk (ZIP)

name: Build NIITE APK

on:
  push:
    branches:
      - main
      - chatgiza-updates
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Capacitor 7 + Gradle 8.11.1 zinahitaji Java 21.
      # Java 17 au 25 zinavunja build ("Unsupported class file major version").
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp styles.css www/styles.css
          cp app.js www/app.js
          cp config.js www/config.js
          cp manifest.json www/manifest.json
          echo "--- www contents ---"
          ls -la www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NIITE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: niite-apk
          path: NIITE.apk
          if-no-files-found: error

      # Hii inatoa link ya moja kwa moja ya kupakua APK.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: NIITE APK ya mwisho
          body: |
            APK ya NIITE — app ya mafundi wa kila aina.

            Pakua NIITE.apk hapa chini, kisha iinstall kwenye simu ya Android.
            Ruhusu "Install unknown apps" ikikataliwa.
          files: NIITE.apk
          make_latest: true
