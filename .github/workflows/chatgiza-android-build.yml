# Generated by ChatGiZa Build -- builds an installable, unsigned debug
# .apk for this project's own current files, self-contained (no live URL
# dependency). Safe to edit or delete.
# build-stamp: 2026-09-23T21:33:35.797Z
name: ChatGiZa Android Build

on:
  push:
    paths:
      - ".github/workflows/chatgiza-android-build.yml"
  workflow_dispatch:
    inputs:
      appName:
        description: "App display name"
        required: true
        default: "NIITE"
      appId:
        description: "Reverse-domain app id"
        required: true
        default: "com.wellxai.niite"

# A push run has no dispatch inputs, so it falls back to the values baked in
# at push time. Plain YAML strings + an input-only expression (no string
# literals inside ${{ }}, which only allows single quotes) keeps an app name
# containing quotes from breaking the file.
env:
  BAKED_APP_NAME: "NIITE"
  BAKED_APP_ID: "com.wellxai.niite"
  INPUT_APP_NAME: ${{ github.event.inputs.appName }}
  INPUT_APP_ID: ${{ github.event.inputs.appId }}

# The default GITHUB_TOKEN on most repos is read-only -- without this the
# build itself can succeed and then the very last step, publishing the APK
# as a Release, fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the web app
        shell: bash
        run: |
          set -o pipefail
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            if [ -f package-lock.json ]; then npm ci 2>&1 | tee -a /tmp/build.log; else npm install 2>&1 | tee -a /tmp/build.log; fi
            npm run build 2>&1 | tee -a /tmp/build.log
          else
            echo "No package.json build script -- using the project's own files as-is (a plain static site)."
          fi
          if [ ! -d dist ] && [ -f index.html ]; then
            mkdir -p dist
            cp -r ./*.html ./*.css ./*.js dist/ 2>/dev/null || true
          fi

      - name: Add Capacitor and sync the Android project
        shell: bash
        run: |
          set -o pipefail
          # A plain static site has no package.json at all -- npm and the
          # Capacitor CLI both expect one, so give it a minimal stand-in.
          [ -f package.json ] || echo '{"name":"app","version":"1.0.0"}' > package.json
          npm install --no-save @capacitor/core@^8.4.2 @capacitor/cli@^8.4.2 @capacitor/android@^8.4.2 2>&1 | tee -a /tmp/build.log
          # A project that already ships its own capacitor.config.* (the
          # Build agent may have created one) must keep it -- cap init
          # refuses to run over an existing config and would fail the job.
          if ls capacitor.config.* >/dev/null 2>&1; then
            echo "Using the project's own capacitor.config."
          else
            APP_NAME="${INPUT_APP_NAME:-$BAKED_APP_NAME}"
            APP_ID="${INPUT_APP_ID:-$BAKED_APP_ID}"
            npx cap init "$APP_NAME" "$APP_ID" --web-dir=dist 2>&1 | tee -a /tmp/build.log
          fi
          # A project that already committed its own android/ folder keeps it --
          # cap add refuses to run over an existing platform.
          if [ ! -d android ]; then npx cap add android 2>&1 | tee -a /tmp/build.log; fi
          npx cap sync android 2>&1 | tee -a /tmp/build.log

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install the compile SDK platform
        shell: bash
        run: |
          set -o pipefail
          (yes | sdkmanager --licenses > /dev/null || true)
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee -a /tmp/build.log

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ubuntu-latest runners have ~7GB RAM total; a full Capacitor/Gradle
      # build (AAPT2, D8/R8) can OOM-kill mid-build even with a conservative
      # heap -- extra swap is cheap insurance, same as android-apk.yml's own.
      - name: Add swap space
        continue-on-error: true
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Unsigned debug build on purpose -- no keystore/signing-key
      # management, matching how ChatGiZa's own sideloaded desktop/Android
      # builds already ask the user to enable "Install unknown apps" rather
      # than distributing through a store.
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --max-workers=1 --stacktrace 2>&1 | tee -a /tmp/build.log

      # Job logs require a GitHub login to view -- this surfaces the failure
      # as a check-run annotation instead, readable via the public API
      # without repo access, matching android-apk.yml's own approach exactly.
      - name: Surface build failure as an annotation
        if: failure()
        shell: bash
        run: |
          set +o pipefail
          if [ -f /tmp/build.log ]; then
            section=$(grep -A2 "^e: " /tmp/build.log | head -c 4000)
            if [ -z "$section" ]; then
              section=$(awk '/FAILURE: Build failed|What went wrong/{found=1} found{print; n++} n>=60{exit}' /tmp/build.log)
            fi
            if [ -z "$section" ]; then
              section=$(tail -n 80 /tmp/build.log)
            fi
          else
            section="(no log was captured -- the failure happened before any logged step)"
          fi
          msg=$(printf '%s' "$section" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error::$msg"

      - name: Publish APK to a GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chatgiza-android-${{ github.run_id }}
          name: "${{ env.INPUT_APP_NAME || env.BAKED_APP_NAME }} (Android build)"
          body: |
            Unsigned debug build from commit ${{ github.sha }}, built by ChatGiZa Build.
            Enable "Install unknown apps" for your browser/file manager to sideload it --
            it is not distributed through the Play Store.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
